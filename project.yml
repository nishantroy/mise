name: Mise
options:
  bundleIdPrefix: com.nishantroy
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    # Owner: set these before building to a device (see README).
    DEVELOPMENT_TEAM: RUQVKZ77U5
    BUNDLE_ID_BASE: com.nishantroy.mise
    APP_GROUP_ID: group.com.nishantroy.mise
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

packages:
  RecipeKit:
    path: Packages/RecipeKit

targets:
  Mise:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: RecipeKit
      - target: MiseShare
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        PRODUCT_NAME: Mise
        # Target presets would otherwise override the project-level value with "1,2".
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Mise.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - MiseUITests
      gatherCoverageData: false

  MiseShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      # Shared with the app: the App Group queue.
      - path: App/Services/PendingImports.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).share
        PRODUCT_NAME: MiseShare
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/MiseShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES

  MiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MiseUITests
      # Recipe fixtures, served to the app through StubRecipeFetcher.
      - path: Packages/RecipeKit/Tests/RecipeKitTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Mise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).uitests
        TEST_TARGET_NAME: Mise
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

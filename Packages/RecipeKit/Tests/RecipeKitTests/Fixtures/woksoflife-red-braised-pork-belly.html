ablespoons regular sugar) in the wok over low heat without letting it burn. Add the pork belly, 3 slices ginger and the scallion whites, raise the heat to medium and stir to coat the pork in the sugar.","url":"https://thewoksoflife.com/red-braised-pork-belly-mao/#wprm-recipe-27023-step-0-1"},{"@type":"HowToStep","text":"Next, add the Shaoxing wine, light soy sauce, dark soy sauce, cinnamon, star anise, bay leaves, dried chili peppers and water, and stir until everything is covered. Cover the wok and bring the mixture to a simmer over medium low heat for 1 hour, checking the pork now and then so the liquid doesn't cook away.","name":"Next, add the Shaoxing wine, light soy sauce, dark soy sauce, cinnamon, star anise, bay leaves, dried chili peppers and water, and stir until everything is covered. Cover the wok and bring the mixture to a simmer over medium low heat for 1 hour, checking the pork now and then so the liquid doesn't cook away.","url":"https://thewoksoflife.com/red-braised-pork-belly-mao/#wprm-recipe-27023-step-0-2"},{"@type":"HowToStep","text":"When the pork is done to your liking, turn up the heat and stir constantly to reduce the sauce to a glaze. Stir in the remaining ½ teaspoon sugar and the scallion greens, and serve.","name":"When the pork is done to your liking, turn up the heat and stir constantly to reduce the sauce to a glaze. Stir in the remaining ½ teaspoon sugar and the scallion greens, and serve.","url":"https://thewoksoflife.com/red-braised-pork-belly-mao/#wprm-recipe-27023-step-0-3"}],"recipeCategory":["Pork"],"recipeCuisine":["Chinese"],"keywords":"braised pork belly","nutrition":{"@type":"NutritionInformation","calories":"667 kcal","carbohydrateContent":"7 g","proteinContent":"12 g","fatContent":"64 g","saturatedFatContent":"22 g","cholesterolContent":"82 mg","sodiumContent":"610 mg","fiberContent":"1 g","sugarContent":"5 g","servingSize":"1 serving"},"@id":"https://thewoksoflife.com/red-braised-pork-belly-mao/#recipe","isPartOf":{"@id":"

round-beef/#wprm-recipe-94079-step-0-0"},{"@type":"HowToStep","text":"For the sauce, stir together the hot water, soy sauce, dark soy sauce and brown sugar in a measuring cup. Make the cornstarch slurry in a small bowl.","name":"For the sauce, stir together the hot water, soy sauce, dark soy sauce and brown sugar in a measuring cup. Make the cornstarch slurry in a small bowl.","url":"https://thewoksoflife.com/shortcut-mongolian-ground-beef/#wprm-recipe-94079-step-0-1"},{"@type":"HowToStep","text":"Add ⅓ cup cornstarch to a shallow dish. Pull the ground beef into small nuggets over it and toss them to coat.","name":"Add ⅓ cup cornstarch to a shallow dish. Pull the ground beef into small nuggets over it and toss them to coat.","url":"https://thewoksoflife.com/shortcut-mongolian-ground-beef/#wprm-recipe-94079-step-0-2"},{"@type":"HowToStep","text":"Heat the wok or skillet over high heat. Add the oil and the beef in a single layer and fry undisturbed until a golden crust forms, then flip and brown the other side. Keep going until it is seared all over, then lift it out and leave the oil in the wok.","name":"Heat the wok or skillet over high heat. Add the oil and the beef in a single layer and fry undisturbed until a golden crust forms, then flip and brown the other side. Keep going until it is seared all over, then lift it out and leave the oil in the wok.","url":"https://thewoksoflife.com/shortcut-mongolian-ground-beef/#wprm-recipe-94079-step-0-3"},{"@type":"HowToStep","text":"Over medium-high heat, add the red chili peppers and cook for 1 minute. Add the ginger, and fry for 30 seconds. Add the white parts of the scallions and the garlic, and cook for another 30 seconds to a minute.","name":"Over medium-high heat, add the red chili peppers and cook for 1 minute. Add the ginger, and fry for 30 seconds. Add the white parts of the scallions and the garlic, and cook for another 30 seconds to a minute.","url":"https://thewoksoflife.com/shortcut-mongolian-ground-beef/#wprm-r

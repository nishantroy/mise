e":"HowToSection","name":"Preparation","itemListElement":[{"@type":"HowToStep","text":"Heat oil in a deep pan over a medium flame, then add the whole spices: bay leaf, cinnamon, cloves &amp; green cardamoms.","name":"Heat oil in a deep pan over a medium flame, then add the whole spices: bay leaf, cinnamon, cloves &amp; green cardamoms.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-0-0"},{"@type":"HowToStep","text":"Add the chopped onions and chilies and saute for 7 to 8 mins, until deep golden.","name":"Add the chopped onions and chilies and saute for 7 to 8 mins, until deep golden.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-0-1"},{"@type":"HowToStep","text":"Stir in the ginger garlic paste and saute for about a minute, until fragrant.","name":"Stir in the ginger garlic paste and saute for about a minute, until fragrant.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-0-2"},{"@type":"HowToStep","text":"Add the tomatoes, turmeric and salt, mix, and cook until the tomatoes break down &amp; soften.","name":"Add the tomatoes, turmeric and salt, mix, and cook until the tomatoes break down &amp; soften.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-0-3"},{"@type":"HowToStep","text":"Lower the heat and stir in the yogurt (or cashew paste), red chili powder, garam masala &amp; coriander powder.","name":"Lower the heat and stir in the yogurt (or cashew paste), red chili powder, garam masala &amp; coriander powder.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-0-4"},{"@type":"HowToStep","text":"Keep cooking on low heat until the mixture smells fragrant.","name":"Keep cooking on low heat until the mixture smells fragrant.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-0-5"},{"@type":"HowToStep","text":"Add chicken and coriander leaves. Fry on a medium heat until the chicken is no longer pink. This takes around 3 mins.","name":"Add chicken and coriander leaves. Fry on a medium heat until the chicken is no longer pink. This takes around 3 mins.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-0-6"},{"@type":"HowToStep","text":"Cover and cook on a low heat for 3 to 4 minutes. The chicken picks up the spices here.","name":"Cover and cook on a low heat for 3 to 4 minutes. The chicken picks up the spices here.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-0-7"},{"@type":"HowToStep","text":"Meanwhile, heat 1 cup water in another pot; hot water keeps the chicken tender.","name":"Meanwhile, heat 1 cup water in another pot; hot water keeps the chicken tender.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-0-8"}]},{"@type":"HowToSection","name":"How to make Chicken Curry","itemListElement":[{"@type":"HowToStep","text":"Pour in just enough hot water (about ½ cup) for a thick gravy, adding more later if needed as the chicken releases moisture.","name":"Pour in just enough hot water (about ½ cup) for a thick gravy, adding more later if needed as the chicken releases moisture.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-1-0"},{"@type":"HowToStep","text":"Cover and cook on a medium flame until the chicken is tender and the gravy has thickened.","name":"Cover and cook on a medium flame until the chicken is tender and the gravy has thickened.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-1-1"},{"@type":"HowToStep","text":"Taste, adjust the salt &amp; add up to ½ tsp more garam masala if you like.","name":"Taste, adjust the salt &amp; add up to ½ tsp more garam masala if you like.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-1-2"},{"@type":"HowToStep","text":"Garnish with coriander leaves, cover and turn off the heat. Serve with naan or rice.","name":"Garnish with coriander leaves, cover and turn off the heat. Serve with naan or rice.","url":"https://www.indianhealthyrecipes.com/chicken-curry/#wprm-recipe-38246-step-1-3"}]}],"recipeCategory":["Main Course","Side"],"recipeCuisine":["Asian","Indian"],"keywords":"chicken curry","nutrition":{"@type":"NutritionInformation","calories":"417 kcal","carbohydrateContent":"10 g","proteinContent":"33 g","fatContent":"26 g","saturatedFatContent":"7 g","cholesterolContent":"126 mg","sodiumContent":"143 mg","fiberContent":"3 g","sugarContent":"3 g","servingSize":"1 serving"},"@id":"https://www.indianhealthyrecipes.com/chicken-curry/#recipe","isPartOf":{"@id":"https://www.indianhealthyrecipes.com/chicken-curry/#article"},"mainEntityOfPage":"https://www.indianhealthyrecipes.com/chicken-curry/"}]}</script>
